services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lifesync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifesync
      POSTGRES_PASSWORD: lifesync_dev_password
      POSTGRES_DB: lifesync_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifesync -d lifesync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lifesync_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
